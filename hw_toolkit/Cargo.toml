[package]
name = "hw_toolkit"
version = "0.1.0"
edition = "2021"
description = "Red-Team hardware security platform – physical/RF/protocol/side-channel"

[features]
default = []
asm = []

[dependencies]
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-complex = "0.4"
rustfft = "6.2"
nalgebra = "0.32"
ndarray = "0.15"
rayon = "1.8"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
base64 = "0.21"

[[bin]]
name = "hw_toolkit"
path = "src/main.rs"
