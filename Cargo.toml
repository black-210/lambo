[package]
name = "iq-research-workbench"
version = "0.2.0"
edition = "2024"
description = "Offline workbench for IQ analysis, local evidence, physical traces, source review, and quantum education"

[dependencies]
hex = "0.4"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
ndarray = "0.16"
ndarray-npy = "0.9"
num-complex = "0.4"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
log = "0.4"
env_logger = "0.10"
nalgebra = "0.32"
rayon = "1.8"
tera = "1.19"
chrono = "0.4"
base64 = "0.21"
# Optional Windows-specific crates
windows = { version = "0.52", optional = true }
winapi = { version = "0.3", optional = true }

[features]
default = []
asm = []

[[bin]]
name = "hw_toolkit"
path = "src/cli.rs"
